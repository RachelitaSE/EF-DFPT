[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ef-dfpt"
version = "0.1.0"
description = "EF-DFPT analysis and post-processing tools"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]
